<!DOCTYPE html>
<head>
    <title>glowing button</title>
    <meta charset="utf-8">
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        body{
            background-color: black;
            width: 1000px;
        }
        .btn button{
            border: 1px solid lightblue;
            border-radius: 7px;
            padding: 10px 20px;
            color:rgb(74, 195, 255);
            position: relative;
            font-family:fantasy;
            z-index: 2;
            transition-duration: 0.4s;
        }
        .btn{
            position: relative;
            align-items: center;
            justify-content: center;
            top:250px;
            left:230px;
            display: flex;
            scale: 2.0;
        }
        .btn button::before{
            background-image: linear-gradient(to right,red,orange,gold,yellow,lime,rgb(16, 255, 16),rgb(0, 193, 177),cyan,rgb(81, 165, 255),blue,purple,pink,pink);
            inset: -3px;
            content: "";
            position: absolute;
            z-index: -1;
            filter: blur(10px);
            background-size: 500% 100%;
            opacity: 0;
            transition-duration: 0.5s;
        }
        .btn button::after{
            position: absolute;
            z-index: 0;
            width: 100%;
            height: 100%;
            left:0;
            top:0;
            border-radius: 8px;
            background-color: rgb(255, 255, 255);
        }
        @keyframes move{
            0%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100% 50%;
            }
            100%{
                background-position:0% 50%; 
            }
        }
        .btn button:hover::before{
            animation: move 3s linear 0s infinite;
            opacity: 1;
        }
        .btn button:hover{
            color: white;
        }
    </style>
</head>
<body id="bodyp">
    <div class="btn">
        <button class="btnnn">Glow!</button>
    </div>
    <script>
        const width = document.getElementById("bodyp").clientWidth;
        document.getElementById("bodyp").style.width=width;
    </script>
</body>
</html>
