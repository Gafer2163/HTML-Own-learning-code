<!DOCTYPE html>
<head>
    <title>Switch</title>
    <meta charset="utf-8">
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .switch{
            position: relative;
            width: 100px;
            height: 50px;
            background-image: linear-gradient(to bottom,rgb(29, 0, 132),rgb(77, 0, 170));
            border-radius: 25px;
            top:250px;
            left:40%;
            border: 1px solid rgba(128, 0, 128, 0.143);
            transition-duration:1s ;
        }
        .btn{
            position: relative;
            left: 10px;
            height: 30px;
            width: 30px;
            appearance: none;
            background-color: white;
            border-radius: 31.4159265358979323846264338327950288419716939937510px;
            top:10px;
            transition-duration: 0.5s;
            z-index: 100;
        }
        @keyframes daymove{
            0%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100% 50%;
            }
            100%{
                background-position: 0% 50%;
            }
        }
        .switch::before{
            inset:-7px;
            content: "";
            position: absolute;
            background-image: linear-gradient(to right,rgb(46, 0, 183),rgb(94, 0, 134));
            z-index: -1;
            filter: blur(10px);
            border-radius: 25px;
            background-size: 500%;
            animation: daymove 3s linear infinite;
        }
        body{
            background-color: rgb(0, 0, 0);
        }
        .s1{
            display: flex;
            position: absolute;
            content: "";
            height: 17px;
            background-image: linear-gradient(to bottom, white, rgb(184, 184, 184));
            left: 55px;
            z-index: 3;
            width: 15px;
            border-radius: 31.4159px;
            scale: 1.3;
            bottom: 2px;
        }
        .s1::before{
            display: flex;
            position: absolute;
            content: "";
            height: 15px;
            background-image: linear-gradient(to bottom, white, rgb(184, 184, 184));
            left: 6px;
            z-index: 3;
            width: 15px;
            border-radius: 31.4159px;
            scale: 0.8;
            bottom: -1.5px;
        }
        .s1::after{
            display: flex;
            position: absolute;
            content: "";
            height: 15px;
            background-image: linear-gradient(to bottom, white, rgb(184, 184, 184));
            left: -6px;
            z-index: 3;
            width: 15px;
            border-radius: 31.4159px;
            scale: 0.8;
            bottom: -1.5px;
        }
        .s3{
            display: flex;
            position: absolute;
            content: "";
            height: 10px;
            width: 12px;
            left: 57px;
            top:-12.5px;
            background-image: linear-gradient(to bottom, white,rgb(184, 184, 184));
            border-radius: 31.4159px;
            scale: 1.8;
            z-index: 10;
        }
        .s2{
            display: flex;
            position: absolute;
            content: "";
            height: 5px;
            width: 5px;
            background-image: linear-gradient(to top, gold, yellow);
            border-radius: 31.4159265px;
            top:5px;
            left:50px;
            scale:0.7;
        }
        .s2::before{
            display: flex;
            position: absolute;
            content: "";
            height: 5px;
            width: 5px;
            background-image: linear-gradient(to top, gold, yellow);
            border-radius: 31.4159265px;
            top:15px;
            left:35px;
        }
        .s2::after{
            display: flex;
            position: absolute;
            content: "";
            height: 5px;
            width: 5px;
            background-image: linear-gradient(to top, gold, yellow);
            border-radius: 31.4159265px;
            top:52px;
            left:-20px;
        }
        .switch:has(.btn:checked){
            position: relative;
            width: 100px;
            height: 50px;
            background-image: linear-gradient(to bottom,rgb(101, 168, 255),rgb(0, 106, 255));
            border-radius: 25px;
            top:250px;
            left:40%;
            border: 1px solid rgb(114, 229, 255);
            transition-duration:1s ;
        }
        .switch:has(.btn:checked)::before{
            inset:-5px;
            content: "";
            position: absolute;
            background-image: linear-gradient(to right,rgb(65, 220, 255),rgb(17, 80, 255));
            z-index: -1;
            filter: blur(10px);
            border-radius: 25px;
            background-size: 500%;
            animation: daymove 3s linear infinite;
        }
        .winds{
            position: relative;
            transform: translateX(1px);
            transition: transform 0.8s ease;
            top:15px;
        }
        .btn:checked ~ .icons .winds {
            transform: translateX(-30px);
        }
        .btn:checked{
            position: relative;
            left:60px;
            height: 30px;
            width: 30px;
            appearance: none;
            background-image: radial-gradient(circle in oklch,rgb(205, 255, 245),white);
            border-radius: 31.4159265358979323846264338327950288419716939937510px;
            top:10px;
            border: none;
            transition-duration: 0.5s;
        }
        .s3:has(.btn:checked){
            display: flex;
            position: absolute;
            content: "";
            height: 10px;
            width: 12px;
            left: 57px;
            top:36px;
            background-image: linear-gradient(to bottom, white,rgb(184, 184, 184));
            border-radius: 31.4159px;
            scale: 2;
            z-index: 10;
        }
        .btn:checked ~ .icons .s2 {
            opacity: 0;
            transition-duration: 0.3s;
        }
        .s4{
            content: "";
            width: 50px;
            display: flex;
            height: 40px;
            width: 40px;
            transition-duration: 0.5s;
            background-color: gold;
            left:-1;
            top:-55px;
            position: relative;
            border-radius: 31.41592653589793px;
            scale: 1.1;
            opacity: 0;
        }
        .s4::before{
            content: "";
            width: 50px;
            display: flex;
            height: 40px;
            width: 40px;
            transition: 0.5s;
            background-color: rgb(255, 168, 47);
            position: relative;
            border-radius: 31.41592653589793px;
            scale: 0.7;
            z-index: 4;
            opacity:0;
        }
        .btn:checked ~ .icons .s4{
            opacity: 1;
        }
        .btn:checked ~ .icons .s4::before{
            opacity: 1;
        }
        .overflow{
            overflow: hidden;
            height: 49px;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <div class="switch">
        <div class="overflow">
        <input type="checkbox" class="btn">
        <div class="icons">
        <div class="winds">
        <span class="s3"></span>
        <span class="s1"></span>
        </div>
        <span class="s2"></span>
        <span class="s4"></span>
        </div>
        </div>
    </div>
</body>
